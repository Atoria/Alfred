name: Feature request
description: Suggest an idea or an improvement for Alfred.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the problem you're trying to solve helps more than a finished design.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you or your users trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Config keys, UI, or code examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Explanations / follow-up questions
        - Changing the UI / preview
        - Tickets and screenshots
        - Pull requests
        - AI providers
        - Permissions, guests, privacy
        - Frontend integration (Livewire, Filament, Inertia)
        - Other

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
