name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Everything between "## [X.Y.Z]" and the next "## [" heading,
          # with leading and trailing blank lines removed.
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md \
            | sed -e '/./,$!d' \
            | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No '## [$version]' section found in CHANGELOG.md"
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ steps.notes.outputs.prerelease }}
