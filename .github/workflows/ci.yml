name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        deps: [lowest, stable]
        include:
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
        exclude:
          # Laravel 13 requires PHP 8.3+.
          - php: '8.2'
            laravel: '13'
          # Laravel 11 doesn't support PHP 8.5.
          - php: '8.5'
            laravel: '11'
          # The lowest versions of our dependencies predate PHP 8.5.
          - php: '8.5'
            deps: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2

      - name: Pin Laravel ${{ matrix.laravel }}
        run: composer require --dev --no-update --no-interaction "illuminate/support:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0"

      # Composer refuses versions with known advisories while resolving. Old
      # Laravel/testbench releases (lowest deps, Laravel 11) have some; these
      # jobs only test compatibility, the "quality" job audits what ships.
      - name: Allow advisory-affected versions for compatibility testing
        run: composer config audit.block-insecure false

      - name: Install dependencies (${{ matrix.deps }})
        run: |
          if [ "${{ matrix.deps }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress
          else
            composer update --prefer-stable --prefer-dist --no-interaction --no-progress
          fi

      - name: Show resolved versions
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/phpunit

  laragent:
    name: LarAgent (PHP 8.4 / Laravel 12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies with maestroerror/laragent
        run: |
          composer config audit.block-insecure false
          composer require --dev --no-update --no-interaction "illuminate/support:^12.0" "orchestra/testbench:^10.0" maestroerror/laragent
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run LarAgent tests (skips count as failures)
        run: vendor/bin/phpunit --filter LarAgentTest --fail-on-skipped

  # Single, stable check name for branch protection ("tests"): matrix job
  # names change whenever the matrix does.
  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: [test-matrix, laragent]
    if: always()
    steps:
      - name: Require every test job to pass
        run: |
          echo "test-matrix: ${{ needs.test-matrix.result }}"
          echo "laragent:    ${{ needs.laragent.result }}"
          [ "${{ needs.test-matrix.result }}" = "success" ] && [ "${{ needs.laragent.result }}" = "success" ]

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies (Laravel 12, with Larastan and Pint)
        run: |
          composer require --dev --no-update --no-interaction "illuminate/support:^12.0" "orchestra/testbench:^10.0" "larastan/larastan:^3.0" "laravel/pint:^1.0"
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Larastan
        run: vendor/bin/phpstan analyse --error-format=github --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Check alfred.js syntax
        run: node --check resources/js/alfred.js

      - name: Check distribution contents
        run: |
          git archive --format=tar HEAD | tar -t > dist-files.txt
          echo "Files in the dist archive:"
          cat dist-files.txt

          status=0

          for path in \
            'tests/' \
            '.github/' \
            'docs/' \
            'phpunit.xml.dist' \
            'phpstan.neon.dist' \
            'phpstan-baseline.neon' \
            'pint.json' \
            '.editorconfig' \
            '.gitattributes' \
            '.gitignore' \
            'CONTRIBUTING.md' \
            'CODE_OF_CONDUCT.md'
          do
            if grep -qxF -e "$path" -e "${path%/}" dist-files.txt || grep -q "^${path%/}/" dist-files.txt; then
              echo "::error::'$path' must not be shipped (add export-ignore to .gitattributes)"
              status=1
            fi
          done

          for path in composer.json LICENSE README.md src/ resources/js/alfred.js; do
            if ! grep -qxF "$path" dist-files.txt; then
              echo "::error::'$path' is missing from the dist archive"
              status=1
            fi
          done

          exit $status
